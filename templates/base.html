<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AirScrobble{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #1A1A1A; }
    .bubbly-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
  </style>
</head>
<body class="min-h-screen antialiased flex flex-col items-center">
  {% if session.get('authed') %}
  <header class="w-full max-w-xl mx-auto px-6 mt-8 mb-4 flex items-center justify-between">
    <a href="/" class="text-xl font-extrabold tracking-tight text-zinc-900 flex items-center gap-2">
      <div class="w-8 h-8 bg-[#FFD700] rounded-full flex items-center justify-center bubbly-shadow">
        <svg class="w-4 h-4 text-zinc-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      AirScrobble
    </a>
    <nav class="flex items-center gap-3">
      <a href="/settings" class="px-4 py-2 bg-white rounded-full text-sm font-bold text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition bubbly-shadow">Settings</a>
      <a href="/logout" class="px-4 py-2 rounded-full text-sm font-bold text-zinc-400 hover:text-zinc-600 transition">Log Out</a>
    </nav>
  </header>
  {% endif %}
  <main class="w-full max-w-xl mx-auto px-6 flex-grow {% block main_class %}py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
