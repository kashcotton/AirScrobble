<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}airscrobble{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Menlo, monospace; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen antialiased">
  {% if session.get('authed') %}
  <header class="border-b border-zinc-800/50">
    <div class="max-w-xl mx-auto px-6 h-12 flex items-center justify-between">
      <a href="/" class="mono text-[13px] font-semibold text-zinc-100 tracking-tight hover:text-white transition-colors">airscrobble</a>
      <nav class="flex items-center gap-5 text-[13px]">
        <a href="/settings" class="text-zinc-500 hover:text-zinc-200 transition-colors">settings</a>
        <a href="/logout" class="text-zinc-600 hover:text-zinc-400 transition-colors">log out</a>
      </nav>
    </div>
  </header>
  {% endif %}
  <main class="max-w-xl mx-auto px-6 {% block main_class %}py-16{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
