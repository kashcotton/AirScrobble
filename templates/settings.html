{% extends "base.html" %}
{% block title %}Settings - AirScrobble{% endblock %}

{% block content %}
<div class="w-full max-w-lg mx-auto bg-white rounded-[2rem] p-8 bubbly-shadow border border-zinc-100">
  <h1 class="text-2xl font-black text-zinc-900 mb-8">Settings</h1>

  <form id="form" class="space-y-8">
    <!-- Last.fm -->
    <section>
      <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-widest mb-4">Last.fm</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-[13px] font-bold text-zinc-600 mb-2">API Key</label>
          <input type="text" name="lastfm_api_key" value="{{ config.lastfm_api_key }}"
                 placeholder="Your Last.fm API key" spellcheck="false"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
        </div>
        <div>
          <label class="block text-[13px] font-bold text-zinc-600 mb-2">Username</label>
          <input type="text" name="lastfm_username" value="{{ config.lastfm_username }}"
                 placeholder="Your Last.fm username" spellcheck="false"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
        </div>
        <div class="pt-1 flex items-center">
          <button type="button" id="test-btn"
                  class="text-xs font-bold text-zinc-500 hover:text-zinc-800 transition-colors cursor-pointer bg-zinc-100 px-3 py-1.5 rounded-full">
            Test connection
          </button>
          <span id="test-msg" class="text-xs font-bold ml-3"></span>
        </div>
      </div>
    </section>

    <hr class="border-zinc-100">

    <!-- Spotify -->
    <section>
      <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-widest mb-4">Spotify</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-[13px] font-bold text-zinc-600 mb-2">SP_DC Cookie (Recommended)</label>
          <input type="password" name="spotify_sp_dc" value="{{ config.spotify_sp_dc }}"
                 placeholder="Paste your sp_dc cookie to bypass login issues" spellcheck="false"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
          <p class="text-[11px] font-semibold text-zinc-400 mt-2 leading-tight">If Spotify blocks the bot login, paste your <b>sp_dc</b> cookie value here. (F12 -> Application -> Cookies -> open.spotify.com)</p>
        </div>
        <div class="opacity-50">
          <label class="block text-[13px] font-bold text-zinc-600 mb-2">Email (Legacy Fallback)</label>
          <input type="email" name="spotify_email" value="{{ config.spotify_email }}"
                 placeholder="your@email.com" spellcheck="false"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
        </div>
        <div class="opacity-50">
          <label class="block text-[13px] font-bold text-zinc-600 mb-2">Password (Legacy Fallback)</label>
          <input type="password" name="spotify_password"
                 placeholder="{{ 'Saved ? leave blank to keep' if has_password else 'Your Spotify password' }}"
                 class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
        </div>
      </div>
    </section>

    <hr class="border-zinc-100">

    <!-- General -->
    <section>
      <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-widest mb-4">General</h2>
      <div>
        <label class="block text-[13px] font-bold text-zinc-600 mb-2">Poll interval (seconds)</label>
        <input type="number" name="poll_interval" value="{{ config.poll_interval or 10 }}" min="5" max="120"
               class="w-32 bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm text-zinc-900 font-medium placeholder-zinc-400 outline-none focus:border-zinc-400 transition-colors">
      </div>
    </section>

    <!-- Actions -->
    <div class="flex items-center gap-4 pt-4">
      <button type="submit"
              class="bg-zinc-900 text-white text-sm font-bold rounded-full px-8 py-3.5 hover:bg-zinc-800 hover:-translate-y-0.5 transform transition shadow-lg">
        Save Changes
      </button>
      <span id="save-msg" class="text-sm font-bold"></span>
    </div>
  </form>
</div>

<script>
const form   = document.getElementById('form');
const sMsg   = document.getElementById('save-msg');
const tBtn   = document.getElementById('test-btn');
const tMsg   = document.getElementById('test-msg');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  if (!d.spotify_password) delete d.spotify_password;

  try {
    const r = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(d),
    });
    if (r.status === 401) { location.href = '/login'; return; }
    const j = await r.json();
    sMsg.textContent = j.ok ? 'Saved successfully!' : 'Error saving settings.';
    sMsg.className   = 'text-sm font-bold ' + (j.ok ? 'text-green-500' : 'text-red-500');
  } catch {
    sMsg.textContent = 'Network error.';
    sMsg.className   = 'text-sm font-bold text-red-500';
  }
  setTimeout(() => sMsg.textContent = '', 4000);
});

tBtn.addEventListener('click', async () => {
  const ak = form.lastfm_api_key.value.trim();
  const un = form.lastfm_username.value.trim();
  tMsg.textContent = 'Testing...';
  tMsg.className   = 'text-xs font-bold text-zinc-400 ml-3';

  try {
    const r = await fetch('/api/test-lastfm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: ak, username: un}),
    });
    const j = await r.json();
    tMsg.textContent = j.ok ? 'Connected!' : (j.error || 'Failed.');
    tMsg.className   = 'text-xs font-bold ml-3 ' + (j.ok ? 'text-green-500' : 'text-red-500');
  } catch {
    tMsg.textContent = 'Network error.';
    tMsg.className   = 'text-xs font-bold ml-3 text-red-500';
  }
  setTimeout(() => tMsg.textContent = '', 5000);
});
</script>
{% endblock %}
