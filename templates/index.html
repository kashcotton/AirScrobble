{% extends "base.html" %}

{% block content %}
<div id="dash" class="w-full flex flex-col items-center">
  <!-- status line -->
  <div class="flex items-center justify-center gap-2 mb-8 bg-white px-5 py-2.5 rounded-full bubbly-shadow border border-zinc-100">
    <span id="dot" class="w-2.5 h-2.5 rounded-full bg-zinc-300 flex-shrink-0 relative">
      <span class="absolute inset-0 rounded-full animate-ping opacity-75 bg-inherit"></span>
    </span>
    <span id="state" class="text-xs font-bold text-zinc-500 uppercase tracking-widest">LOADING</span>
  </div>

  <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 bubbly-shadow flex flex-col items-center text-center relative overflow-hidden border border-zinc-100">
    <!-- not configured -->
    <div id="v-setup" class="hidden flex flex-col items-center w-full py-4">
      <div class="w-16 h-16 bg-zinc-100 rounded-full flex items-center justify-center mb-5">
        <svg class="w-8 h-8 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </div>
      <p class="text-base font-bold text-zinc-600 mb-5">Setup required</p>
      <a href="/settings" class="px-6 py-3 bg-zinc-900 text-white font-bold rounded-full text-sm hover:bg-zinc-800 transition shadow-lg hover:-translate-y-0.5 transform">Configure App</a>
    </div>

    <!-- idle -->
    <div id="v-idle" class="hidden flex flex-col items-center w-full py-10">
      <div class="w-24 h-24 bg-zinc-50 rounded-3xl flex items-center justify-center mb-6 -rotate-6 shadow-sm border border-zinc-100">
        <svg class="w-10 h-10 text-zinc-300" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      <p class="text-lg font-bold text-zinc-400">Nothing playing</p>
    </div>

    <!-- now playing -->
    <div id="v-playing" class="hidden flex flex-col items-center w-full">
      <img id="art" src="" alt="" class="w-56 h-56 rounded-3xl bg-zinc-100 object-cover shadow-xl mb-6 transition-transform duration-500 hover:scale-[1.02]">
      <p id="track" class="text-2xl font-black text-zinc-900 w-full truncate px-2 leading-tight"></p>
      <p id="artist" class="text-base font-semibold text-zinc-500 w-full truncate mt-1.5"></p>
      <div class="flex items-center justify-center gap-1.5 mt-5 px-4 py-1.5 bg-zinc-50 border border-zinc-100 rounded-full">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1.5-12v6l5-3-5-3z"/></svg>
        <p id="album" class="text-[11px] font-bold text-zinc-400 max-w-[220px] truncate uppercase tracking-wide"></p>
      </div>
    </div>

    <!-- error -->
    <div id="v-error" class="hidden flex flex-col items-center w-full py-8">
      <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <p id="err-msg" class="text-sm font-bold text-red-500 px-4 leading-relaxed">Something went wrong.</p>
    </div>
  </div>

  <!-- timestamp -->
  <p id="ts" class="text-[11px] font-bold text-zinc-400 mt-6 tracking-wide uppercase"></p>
</div>

<script>
const g = id => document.getElementById(id);
const views = ['v-setup','v-idle','v-playing','v-error'];
const dots = {
  syncing:'bg-green-400', idle:'bg-zinc-300',
  not_configured:'bg-zinc-300', error:'bg-red-400',
};
const labels = {
  syncing:'syncing', idle:'idle', not_configured:'setup required',
  error:'error', starting:'starting',
};

function show(id) {
  views.forEach(v => g(v).classList.toggle('hidden', v !== id));
}

function render(d) {
  g('dot').className = 'w-2.5 h-2.5 rounded-full flex-shrink-0 relative ' + (dots[d.state] || 'bg-zinc-300');
  g('state').textContent = labels[d.state] || d.state || '...';

  if (!d.configured && d.state === 'not_configured') { show('v-setup'); }
  else if (d.state === 'syncing') {
    show('v-playing');
    g('track').textContent = d.track || '';
    g('artist').textContent = d.artist || '';
    g('album').textContent = d.album || '';
    if (d.artwork) { g('art').src = d.artwork; g('art').classList.remove('hidden'); }
    else { g('art').classList.add('hidden'); }
  }
  else if (d.state === 'error') {
    show('v-error');
    if (d.error) g('err-msg').textContent = d.error;
  }
  else { show('v-idle'); }

  if (d.updated) {
    const s = Math.round((Date.now() - new Date(d.updated).getTime()) / 1000);
    g('ts').textContent = s < 5 ? 'just now' : s + 's ago';
  }
}

async function poll() {
  try {
    const r = await fetch('/api/status');
    if (r.status === 401) { location.href = '/login'; return; }
    render(await r.json());
  } catch {
    g('state').textContent = 'offline';
    g('dot').className = 'w-2.5 h-2.5 rounded-full flex-shrink-0 relative bg-red-400';
  }
}

poll();
setInterval(poll, 3000);
</script>
{% endblock %}
